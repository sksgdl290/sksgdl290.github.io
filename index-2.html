<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>SKS ATC Command Center</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:#050505;color:#F1F4F6;font-family:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;display:grid;place-items:center;padding:20px;
 background-image:radial-gradient(800px 400px at 80% -10%,rgba(25,196,237,.14),transparent 60%)}
.box{width:100%;max-width:380px;border:1px solid #262B32;border-radius:14px;background:#15171A;padding:28px 26px}
.brand{font-family:'Archivo',sans-serif;font-weight:700;letter-spacing:.16em;font-size:19px;display:flex;align-items:center;gap:9px}
.dot{width:7px;height:7px;border-radius:50%;background:#19C4ED;box-shadow:0 0 12px #19C4ED}
.sub{font-family:'IBM Plex Mono',monospace;font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#8FDDF1;margin-top:6px}
p.l{color:#A4ADB6;font-size:13.5px;margin:18px 0 20px;line-height:1.55}
label{display:block;font-family:'IBM Plex Mono',monospace;font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:#6B747D;margin:0 0 6px}
input[type=text],input[type=password]{width:100%;padding:11px 12px;background:#1B1E23;border:1px solid #262B32;border-radius:8px;color:#F1F4F6;font:inherit;font-size:15px;margin-bottom:14px}
input:focus{outline:none;border-color:rgba(25,196,237,.45)}
label.chk{display:flex;gap:9px;align-items:center;font-family:inherit;font-size:13px;letter-spacing:0;text-transform:none;color:#A4ADB6;margin:2px 0 18px;cursor:pointer}
.chk input{accent-color:#19C4ED;width:16px;height:16px}
button{width:100%;padding:12px;background:#19C4ED;color:#03212B;border:0;border-radius:8px;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;cursor:pointer}
button:hover{background:#8FDDF1}
button:disabled{opacity:.6;cursor:wait}
.err{display:none;margin-top:12px;padding:10px 12px;border-left:3px solid #FF5A63;background:rgba(255,90,99,.10);border-radius:0 6px 6px 0;font-size:13px;color:#FF5A63}
.foot{margin-top:18px;font-size:11.5px;color:#6B747D;line-height:1.5}
</style></head><body>
<form class="box" id="f" autocomplete="on">
  <div class="brand"><span class="dot"></span>SKS</div>
  <div class="sub">ATC Command Center</div>
  <p class="l">Acceso exclusivo para el equipo de Atención al Cliente de SKS.</p>
  <label for="u">Usuario</label>
  <input type="text" id="u" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
  <label for="p">Contraseña</label>
  <input type="password" id="p" name="password" autocomplete="current-password" required>
  <label class="chk"><input type="checkbox" id="r" checked> Mantener mi sesión en este dispositivo</label>
  <button type="submit" id="b">Entrar</button>
  <div class="err" id="e">Usuario o contraseña incorrectos.</div>
  <div class="foot">Documento interno. No compartas tu acceso fuera del equipo.</div>
</form>

const enc=new TextEncoder();
const b2a=b=>Uint8Array.from(atob(b),c=>c.charCodeAt(0));
async function derive(u,p){
  const base=await crypto.subtle.importKey('raw',enc.encode(p),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:enc.encode('sks-atc:'+u.trim().toLowerCase()),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},true,['decrypt']);
}
async function open(key){
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b2a(IV)},key,b2a(CT));
  const html=new TextDecoder().decode(pt);
  document.open(); document.write(html); document.close();
}
async function tryStored(){
  let raw=null; try{ raw=localStorage.getItem('sks_atc_k')||sessionStorage.getItem('sks_atc_k'); }catch(e){}
  if(!raw) return;
  try{ const key=await crypto.subtle.importKey('raw',b2a(raw),{name:'AES-GCM'},true,['decrypt']); await open(key); }
  catch(e){ try{localStorage.removeItem('sks_atc_k');sessionStorage.removeItem('sks_atc_k');}catch(_){} }
}
document.getElementById('f').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const b=document.getElementById('b'), e=document.getElementById('e');
  b.disabled=true; b.textContent='Verificando…'; e.style.display='none';
  try{
    const key=await derive(document.getElementById('u').value, document.getElementById('p').value);
    const raw=btoa(String.fromCharCode(...new Uint8Array(await crypto.subtle.exportKey('raw',key))));
    try{ (document.getElementById('r').checked?localStorage:sessionStorage).setItem('sks_atc_k',raw); }catch(_){}
    await open(key);
  }catch(err){
    e.style.display='block'; b.disabled=false; b.textContent='Entrar';
  }
});
